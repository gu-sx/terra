[package]
name = "terra-import"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
# Without the default fork and timeout features, which spawn test subprocesses.
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_json = "1.0.154"
