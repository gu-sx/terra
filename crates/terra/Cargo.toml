[package]
name = "terra"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "terra"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
# The XDG data directory, where the library lives by default.
etcetera = "0.11.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
ratatui = "0.30.2"
# `testing` provides the sample library that `terra tui --demo` runs on.
terra-core = { path = "../terra-core", features = ["testing"] }
terra-player = { path = "../terra-player" }
terra-storage = { path = "../terra-storage" }
# `sync` carries the player's events into the event loop.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "macros", "sync"] }
# The host name, which names the device a play is recorded on.
whoami = { version = "2.1.3", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3.27.0"
