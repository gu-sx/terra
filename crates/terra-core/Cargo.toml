[package]
name = "terra-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Domain types and the library backend trait, with no I/O and no async runtime"

[features]
# The in-memory backend, the sample library and the backend contract suite.
# The ICU crates fold accents in the in-memory backend's search; a build
# without `testing` does not depend on them.
testing = ["dep:icu_normalizer", "dep:icu_properties"]

[dependencies]
icu_normalizer = { version = "2.4.0", optional = true, default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.4.0", optional = true, default-features = false, features = ["compiled_data"] }
url = "2.5.8"

[[test]]
name = "memory_contract"
required-features = ["testing"]
